spring:
  application:
    name: auditing-service

server:
  port: 9090

database:
  id: 7
  schema: aaa

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] correlation_id=%X{correlation_id} service_method=%X{service_method} source_service=%X{source_service} user_id=%X{user_id} session_key=%X{session_key} %logger{36} - %msg%n"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.pgmbim: ${LOGGING_LEVEL_ORG_PGMBIM:DEBUG}

das-grpc:
  host: ${DAS_GRPC_HOST:10.99.100.116}
  port: ${DAS_GRPC_PORT:30000}

ghost-login:
  enabled: ${GHOST_LOGIN_ENABLED:true}
  user-id: ${GHOST_LOGIN_USER_ID:200000000}
